<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Typing Profile - TypingMaster Pro</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #041e12;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #16452c, #041e12 65%);
    }
    main {
      width: min(100%, 520px);
      padding: 28px;
      border: 1px solid rgba(148, 163, 184, .35);
      border-radius: 24px;
      background: #10251a;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      text-align: center;
    }
    .avatar {
      width: 112px;
      height: 112px;
      border: 4px solid #34d399;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
    }
    .avatar-wrap { position: relative; display: inline-block; }
    .avatar-upload-button {
      position: absolute;
      right: 0;
      bottom: 3px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 2px solid #10251a;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      font: inherit;
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
      transition: background-color .12s ease;
    }
    .avatar-upload-button:focus-visible { outline: 3px solid #a7f3d0; outline-offset: 2px; }
    .avatar-upload-button:hover:not(:disabled) { background: #1d4ed8; }
    .avatar-upload-button:active:not(:disabled) { background: #1e40af; }
    .avatar-upload-button:disabled { cursor: wait; filter: grayscale(.2); opacity: .8; }
    #profile-photo-status { min-height: 16px; margin: 8px 0; color: #cbd5e1; font-size: 12px; }
    h1 { margin: 16px 0 6px; font-size: 28px; overflow-wrap: anywhere; }
    .user-id, .bio, #profile-status { color: #cbd5e1; }
    .bio { margin: 18px auto; max-width: 420px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .edit-form { margin: 20px 0; padding: 18px; border-radius: 16px; background: #1b3527; text-align: left; }
    .badge-request-panel {
      margin: 14px 0 0;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, .28);
      border-radius: 12px;
      background: rgba(27, 53, 39, .72);
    }
    .badge-request-panel h3 { margin: 0 0 4px; font-size: 13px; }
    .badge-request-panel > p:not(.verification-status) { margin: 0 0 8px; color: #cbd5e1; font-size: 10px; line-height: 1.4; }
    .badge-request-panel label { display: block; margin: 7px 0 4px; font-size: 10px; font-weight: 700; }
    .badge-request-panel select,
    .badge-request-panel input {
      width: 100%;
      min-height: 32px;
      margin: 0 0 6px;
      padding: 6px 8px;
      border: 1px solid #64748b;
      border-radius: 8px;
      background: #f8fafc;
      color: #0f172a;
      font: inherit;
      font-size: 11px;
    }
    .badge-request-panel .button {
      padding: 7px 11px;
      border-radius: 9px;
      font-size: 11px;
      box-shadow: 0 3px 0 #123b9b, 0 4px 8px rgba(0, 0, 0, .2);
    }
    .badge-request-panel .verification-status { min-height: 0; margin: 5px 0 0; font-size: 10px; }
    .edit-form label { display: block; margin: 12px 0 6px; color: #e2e8f0; font-size: 13px; font-weight: 700; }
    .edit-form input:not([type="checkbox"]):not([type="file"]) {

      padding: 11px;
      border: 1px solid #64748b;
      border-radius: 10px;
      background: #f8fafc;
      color: #0f172a;

      border-radius: 10px;

    .contacts { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .button {
      display: inline-block;

      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;

      cursor: pointer;

    }

    .button:active:not(:disabled) {

    [hidden] { display: none !important; }
    @media (max-width: 420px) {
      main { padding: 22px 16px; }
      h1 { font-size: 24px; }

    function currentDhakaMonth() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Dhaka",
        year: "numeric",
        month: "2-digit"
      }).formatToParts(new Date());
      const year = parts.find(part => part.type === "year").value;
      const month = parts.find(part => part.type === "month").value;
      return `${year}-${month}`;
    }

    function showProfileError(message) {
      document.getElementById("profile-status").textContent = message;
      document.getElementById("profile-status").hidden = false;
      if (!profileAccount) document.getElementById("profile-content").hidden = true;
      document.getElementById("profile-retry").hidden = false;
    }

    function withTimeout(promise, timeoutMs, label) {
      let timeoutId;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timeoutId = setTimeout(() => reject(new Error(`${label} timed out.`)), timeoutMs);
        })
      ]).finally(() => clearTimeout(timeoutId));
    }

    function toggleProfileEditor(show) {
      document.getElementById("profile-edit-form").hidden = !show;
      document.getElementById("edit-toggle").textContent = show ? "Close editor" : "Edit profile";
      document.getElementById("edit-status").textContent = "";
    }

    function setPhoneEditorValue(phone) {
      const countryCode = document.getElementById("edit-country-code");
      const phoneInput = document.getElementById("edit-whatsapp");
      let digits = String(phone || "").replace(/\D/g, "");
      const matchingOption = [...countryCode.options]
        .sort((a, b) => b.value.length - a.value.length)
        .find(option => digits.startsWith(option.value.slice(1)));
      if (matchingOption) {
        countryCode.value = matchingOption.value;
        digits = digits.slice(matchingOption.value.length - 1);
      } else {
        countryCode.value = "+880";
        if (digits.startsWith("0")) digits = digits.slice(1);
      }
      phoneInput.value = digits;
      updateSelectedCountryFlag();
    }

    function normalizePhone(phone) {
      let digits = String(phone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("00")) digits = digits.slice(2);
      if (digits.startsWith("0")) return `+880${digits.slice(1)}`;
      return `+${digits}`;
    }

    function getEditorPhone() {
      const countryCode = document.getElementById("edit-country-code").value;
      let phoneDigits = document.getElementById("edit-whatsapp").value.replace(/\D/g, "");
      if (phoneDigits.startsWith("0")) phoneDigits = phoneDigits.slice(1);
      return phoneDigits ? `${countryCode}${phoneDigits}` : "";
    }

    function updateSelectedCountryFlag() {
      const selectedOption = document.getElementById("edit-country-code").selectedOptions[0];
      const flag = document.getElementById("edit-country-flag");
      const countryCode = selectedOption.dataset.country;
      flag.src = `https://flagcdn.com/w40/${countryCode}.png`;
      flag.alt = `${selectedOption.dataset.name} flag`;
    }

      document.getElementById("edit-name").value = String(user.name || id);
      document.getElementById("edit-photo-file").value = "";

      document.getElementById("edit-has-whatsapp").checked = user.hasWhatsApp !== false;

      document.getElementById("email-verification-status").textContent =
        user.emailVerified === true ? "Saved email address is verified." : "";

    async function compressProfilePhoto(file) {
      const objectUrl = URL.createObjectURL(file);
      const image = new Image();
      try {
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error("Could not read the selected photo."));
          image.src = objectUrl;
        });
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      if (!context) throw new Error("Photo compression is not supported in this browser.");
      const longestSide = Math.max(image.naturalWidth, image.naturalHeight);
      for (const maxDimension of [400, 300, 220]) {
        const scale = Math.min(1, maxDimension / longestSide);
        canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        for (const quality of [0.82, 0.68, 0.54, 0.4]) {
          const compressed = canvas.toDataURL("image/jpeg", quality);
          if (compressed.length <= 350000) return compressed;
        }
      }
      throw new Error("The selected photo could not be compressed to a supported size.");
    }

    async function saveProfile(event) {
      event.preventDefault();
      const status = document.getElementById("edit-status");
      const saveButton = document.getElementById("edit-save");
      if (!profileDatabase || !profileAccount || !profileAccountId) {
        status.textContent = "Profile data is not ready. Please reload and try again.";
        return;
      }
      if (loggedInUserId !== profileAccountId.toLowerCase()) {
        status.textContent = "Log in with this account to edit this profile.";
        return;
      }

      const newId = document.getElementById("edit-id").value.trim().toLowerCase();
      const name = document.getElementById("edit-name").value.trim();
      const photoFile = document.getElementById("edit-photo-file").files[0];
      const whatsapp = getEditorPhone();
      const email = document.getElementById("edit-email").value.trim();
      const showWhatsApp = document.getElementById("edit-show-whatsapp").checked;
      const hasWhatsApp = document.getElementById("edit-has-whatsapp").checked;
      const showEmail = document.getElementById("edit-show-email").checked;
      if (!newId || !name) {
        status.textContent = "User ID and name are required.";
        return;
      }
      if (/[.#$\/\[\]]/.test(newId)) {
        status.textContent = "User ID cannot contain . # $ / [ or ].";
        return;
      }
      const whatsappDigits = whatsapp.replace(/\D/g, "");
      if (whatsapp && (whatsappDigits.length < 8 || whatsappDigits.length > 15)) {
        status.textContent = "Enter a valid WhatsApp number with country code.";
        return;
      }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = "Enter a valid email address.";
        return;
      }
      if (showWhatsApp && !whatsapp) {
        status.textContent = "Add a WhatsApp number or turn off public visibility.";
        return;
      }
      if (showEmail && !email) {
        status.textContent = "Add an email or turn off public visibility.";
        return;
      }
      const phoneChanged = normalizePhone(whatsapp) !== normalizePhone(profileAccount.whatsapp);
      const emailChanged = email.trim().toLowerCase() !== String(profileAccount.email || "").trim().toLowerCase();
      const phoneIsVerified = profileAccount.phoneVerified === true &&
        normalizePhone(profileAccount.verifiedPhone) === normalizePhone(whatsapp);
      const emailIsVerified = profileAccount.emailVerified === true &&
        String(profileAccount.email || "").trim().toLowerCase() === email.trim().toLowerCase();
      if (whatsapp && (phoneChanged || showWhatsApp) && !phoneIsVerified) {
        status.textContent = "Verify the new phone number with its SMS code before saving.";
        return;
      }
      if (email && (emailChanged || showEmail) && !emailIsVerified) {
        status.textContent = "Verify the new email using the link sent to that address before saving.";
        return;
      }

      saveButton.disabled = true;
      status.textContent = "Saving profile...";
      try {
        const usersSnapshot = await profileDatabase.ref("users").once("value");
        const users = usersSnapshot.val() || {};
        const matchingId = Object.keys(users).find(id => id.toLowerCase() === newId);
        if (matchingId && matchingId.toLowerCase() !== profileAccountId.toLowerCase()) {
          status.textContent = "That User ID is already in use.";
          return;
        }
        let pic = profileAccount.pic || "";
        if (photoFile) pic = await compressProfilePhoto(photoFile);
        const updatedUser = {
          ...profileAccount,
          id: newId,
          name,
          pic,
          whatsapp,
          email,
          showWhatsApp,
          hasWhatsApp,
          showEmail
        };
        if (!whatsapp) {
          updatedUser.phoneVerified = false;
          updatedUser.verifiedPhone = "";
        }
        if (!email) updatedUser.emailVerified = false;

        const updates = {};
        updates[`users/${newId}`] = updatedUser;
        if (newId !== profileAccountId) updates[`users/${profileAccountId}`] = null;
        await profileDatabase.ref().update(updates);

        const updatedUsers = { ...users };
        if (newId !== profileAccountId) delete updatedUsers[profileAccountId];
        updatedUsers[newId] = updatedUser;
        profileAccount = updatedUser;
        profileAccountId = newId;
        localStorage.setItem("currentUser", JSON.stringify(updatedUser));
        history.replaceState(null, "", `profile.html?id=${encodeURIComponent(newId)}`);
        renderProfile(updatedUser, newId, updatedUsers);
        fillProfileEditor(updatedUser, newId);
        toggleProfileEditor(false);
        status.textContent = "Profile updated successfully.";
      } catch (error) {
        console.error("Profile update failed:", error);
        status.textContent = error.message || "Could not update profile. Check your connection and try again.";
      } finally {
        saveButton.disabled = false;
      }
    }

    function renderProfile(user, id, users, ranksAreComplete = true) {
      const currentMonth = currentDhakaMonth();
      const rankedUsers = ranksAreComplete ? Object.entries(users).map(([userId, account]) => ({
        id: userId,
        monthlyPoints: account && account.monthlyPointsMonth === currentMonth
          ? Number(account.monthlyPoints) || 0
          : 0,
        points: Number(account && account.points) || 0
      })) : [];
      if (ranksAreComplete) {
        const userIndex = rankedUsers.findIndex(account => account.id === id);
        if (userIndex < 0) rankedUsers.push({
          id,
          monthlyPoints: user.monthlyPointsMonth === currentMonth ? Number(user.monthlyPoints) || 0 : 0,
          points: Number(user.points) || 0
        });
        rankedUsers.sort((a, b) => b.monthlyPoints - a.monthlyPoints || b.points - a.points);
      }
      const rank = ranksAreComplete ? rankedUsers.findIndex(account => account.id === id) + 1 : 0;
      const monthlyPoints = user.monthlyPointsMonth === currentMonth
        ? Number(user.monthlyPoints) || 0
        : 0;

      const avatar = document.getElementById("profile-avatar");
      avatar.onerror = () => {
        avatar.onerror = null;
        avatar.src = "logo.png";
      };
      avatar.src = typeof user.pic === "string" && user.pic.trim() ? user.pic : "logo.png";
      document.getElementById("profile-name").textContent = String(user.name || id);
      const verifiedBadge = document.getElementById("profile-verified-badge");
      verifiedBadge.innerHTML = user.verifiedBadge === true
        ? renderProfileBadgeMarkup(user.verifiedBadgeType)
        : "";
      verifiedBadge.hidden = user.verifiedBadge !== true;
      document.getElementById("profile-id").textContent = `ID: ${id}`;
      document.getElementById("profile-bio").textContent = String(user.bio || "Typing profile");
      document.getElementById("profile-rank").textContent = rank > 0 ? `#${rank}` : "#--";
      document.getElementById("profile-rank-status").textContent = ranksAreComplete ? "" : "Loading leaderboard position...";
      document.getElementById("profile-monthly-points").textContent = String(monthlyPoints);
      document.getElementById("profile-points").textContent = String(Number(user.points) || 0);
      document.getElementById("profile-wpm").textContent = String(Number(user.bestWpm) || 0);

      const whatsapp = String(user.whatsapp || "").replace(/\D/g, "");
      const validWhatsappNumber = user.showWhatsApp === true &&
        user.phoneVerified === true &&
        normalizePhone(user.verifiedPhone) === normalizePhone(user.whatsapp) &&
        whatsapp.length >= 8 && whatsapp.length <= 15;
      const showWhatsapp = validWhatsappNumber && user.hasWhatsApp !== false;
      const showEmail = user.showEmail === true && user.emailVerified === true &&
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(user.email || ""));
      const whatsappNumber = document.getElementById("profile-whatsapp-number");
      const whatsappLink = document.getElementById("profile-whatsapp");
      const emailLink = document.getElementById("profile-email");
      whatsappNumber.hidden = !validWhatsappNumber;
      if (validWhatsappNumber) whatsappNumber.textContent = String(user.whatsapp);
      whatsappLink.hidden = !showWhatsapp;
      emailLink.hidden = !showEmail;
      if (showWhatsapp) whatsappLink.href = `https://wa.me/${whatsapp}`;
      if (showEmail) emailLink.href = `mailto:${user.email}`;
      document.getElementById("profile-contacts").hidden = !validWhatsappNumber && !showEmail;
    }

    async function sendPhoneVerificationCode() {
      const status = document.getElementById("phone-verification-status");
      const phone = getEditorPhone();
      const digits = phone.replace(/\D/g, "");
      if (loggedInUserId !== String(profileAccountId || "").toLowerCase()) {
        status.textContent = "Log in with this account to verify its phone number.";
        return;
      }
      if (digits.length < 8 || digits.length > 15) {
        status.textContent = "Select a country code and enter a valid phone number.";
        return;
      }
      if (!["http:", "https:"].includes(location.protocol)) {
        status.textContent = "SMS verification needs the website to run on its hosted domain or localhost, not from a file.";
        return;
      }

      const button = document.getElementById("send-phone-code");
      button.disabled = true;
      status.textContent = "Preparing secure SMS verification...";
      try {
        const auth = firebase.auth();
        auth.languageCode = "bn";
        if (phoneRecaptchaVerifier) phoneRecaptchaVerifier.clear();
        phoneRecaptchaVerifier = new firebase.auth.RecaptchaVerifier("phone-recaptcha-container", {
          size: "invisible"
        });
        await phoneRecaptchaVerifier.render();
        phoneConfirmation = await auth.signInWithPhoneNumber(phone, phoneRecaptchaVerifier);
        document.getElementById("phone-verification-code").hidden = false;
        document.getElementById("verify-phone-code").hidden = false;
        status.textContent = `A verification code was sent to ${phone}.`;
      } catch (error) {
        console.error("Could not send phone verification code:", error);
        if (phoneRecaptchaVerifier) {
          phoneRecaptchaVerifier.clear();
          phoneRecaptchaVerifier = null;
        }
        status.textContent = error.code === "auth/unauthorized-domain"
          ? "This site is not authorized for Firebase Authentication. Add its domain in Firebase Console."
          : error.code === "auth/operation-not-allowed"
            ? "Phone sign-in is not enabled in Firebase Console."
            : error.message || "Could not send the SMS code. Check your connection and try again.";
      } finally {
        button.disabled = false;
      }
    }

    async function verifyPhoneCode() {
      const status = document.getElementById("phone-verification-status");
      const code = document.getElementById("phone-verification-code").value.trim();
      if (!phoneConfirmation) {
        status.textContent = "Request an SMS code first.";
        return;
      }
      if (!/^\d{6}$/.test(code)) {
        status.textContent = "Enter the 6-digit SMS code.";
        return;
      }
      const button = document.getElementById("verify-phone-code");
      button.disabled = true;
      status.textContent = "Verifying phone number...";
      try {
        const credential = await phoneConfirmation.confirm(code);
        const verifiedPhone = normalizePhone(credential.user.phoneNumber || getEditorPhone());
        if (verifiedPhone !== normalizePhone(getEditorPhone())) {
          throw new Error("The verified phone does not match the number in the form.");
        }
        const updates = {
          whatsapp: verifiedPhone,
          verifiedPhone,
          phoneVerified: true
        };
        await profileDatabase.ref(`users/${profileAccountId}`).update(updates);
        profileAccount = { ...profileAccount, ...updates };
        localStorage.setItem("currentUser", JSON.stringify({
          ...JSON.parse(localStorage.getItem("currentUser") || "{}"),
          ...updates
        }));
        fillProfileEditor(profileAccount, profileAccountId);
        renderProfile(profileAccount, profileAccountId, { [profileAccountId]: profileAccount }, false);
        status.textContent = "Phone number verified and saved.";
        phoneConfirmation = null;
        await firebase.auth().signOut();
      } catch (error) {
        console.error("Phone verification failed:", error);
        status.textContent = error.code === "auth/invalid-verification-code"
          ? "That SMS code is incorrect. Check it and try again."
          : error.message || "Could not verify this phone number.";
        try {
          if (firebase.auth().currentUser) await firebase.auth().signOut();
        } catch (signOutError) {
          console.error("Could not sign out after phone verification:", signOutError);
        }
      } finally {
        button.disabled = false;
      }
    }

    async function sendEmailVerificationLink() {
      const status = document.getElementById("email-verification-status");
      const email = document.getElementById("edit-email").value.trim();
      if (loggedInUserId !== String(profileAccountId || "").toLowerCase()) {
        status.textContent = "Log in with this account to verify its email address.";
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = "Enter a valid email address first.";
        return;
      }
      if (!["http:", "https:"].includes(location.protocol)) {
        status.textContent = "Email verification needs the website to run on its hosted domain or localhost, not from a file.";
        return;
      }

      const button = document.getElementById("send-email-verification");
      button.disabled = true;
      status.textContent = "Sending verification link...";
      try {
        const actionUrl = new URL(location.href);
        actionUrl.searchParams.set("verifyEmail", "1");
        const emailLinkSettings = {
          url: actionUrl.toString(),
          handleCodeInApp: true
        };
        await firebase.auth().sendSignInLinkToEmail(email, emailLinkSettings);
        localStorage.setItem(PENDING_EMAIL_VERIFICATION_KEY, JSON.stringify({
          email,
          id: profileAccountId
        }));
        status.textContent = `Verification link sent to ${email}. Open it on this device to finish verifying.`;
      } catch (error) {
        console.error("Could not send email verification link:", error);
        status.textContent = error.code === "auth/unauthorized-continue-uri"
          ? "Add this website address to authorized domains in Firebase Console."
          : error.code === "auth/operation-not-allowed"
            ? "Email link sign-in is not enabled in Firebase Console."
            : error.message || "Could not send the email link. Check the address and try again.";
      } finally {
        button.disabled = false;
      }
    }

    async function completeEmailVerification(app) {
      const auth = app.auth();
      if (!auth.isSignInWithEmailLink(location.href)) return;
      const status = document.getElementById("email-verification-status");
      try {
        const pending = JSON.parse(localStorage.getItem(PENDING_EMAIL_VERIFICATION_KEY) || "null");
        if (!pending || !pending.email || !pending.id) {
          status.textContent = "This verification link is missing its saved request. Request a new link from your profile.";
          return;
        }
        const result = await auth.signInWithEmailLink(pending.email, location.href);
        if (!result.user.emailVerified ||
            String(result.user.email || "").toLowerCase() !== String(pending.email).toLowerCase()) {
          throw new Error("The verification link did not confirm the requested email address.");
        }
        if (String(pending.id).toLowerCase() !== String(profileAccountId).toLowerCase()) {
          throw new Error("The profile ID changed while the email verification was pending. Request a new link.");
        }
        const updates = { email: pending.email, emailVerified: true };
        await profileDatabase.ref(`users/${profileAccountId}`).update(updates);
        profileAccount = { ...profileAccount, ...updates };
        localStorage.setItem("currentUser", JSON.stringify({
          ...JSON.parse(localStorage.getItem("currentUser") || "{}"),
          ...updates
        }));
        fillProfileEditor(profileAccount, profileAccountId);
        renderProfile(profileAccount, profileAccountId, { [profileAccountId]: profileAccount }, false);
        localStorage.removeItem(PENDING_EMAIL_VERIFICATION_KEY);
        status.textContent = "Email address verified and saved.";
        const cleanUrl = new URL(location.href);
        cleanUrl.searchParams.delete("verifyEmail");
        ["apiKey", "oobCode", "mode", "lang", "continueUrl"].forEach(key => cleanUrl.searchParams.delete(key));
        history.replaceState(null, "", cleanUrl);
      } catch (error) {
        console.error("Email verification failed:", error);
        status.textContent = error.code === "auth/invalid-action-code"
          ? "This email verification link is invalid or expired. Request a new link."
          : error.message || "Could not verify this email address.";
      } finally {
        try {
          if (auth.currentUser) await auth.signOut();
        } catch (error) {
          console.error("Could not sign out after email verification:", error);
        }
      }
    }

    async function loadProfile() {
      const retryButton = document.getElementById("profile-retry");
      retryButton.hidden = true;
      document.getElementById("profile-status").hidden = false;
      document.getElementById("profile-status").textContent = "Loading profile...";
      const profileId = new URLSearchParams(location.search).get("id");
      if (!profileId) {
        showProfileError("No profile was selected.");
        return;
      }
      if (typeof firebase === "undefined" || !firebase.database) {
        showProfileError("Could not connect to the profile service. Please check your connection and try again.");
        return;
      }

      try {
        let storedUser = null;
        try {
          storedUser = JSON.parse(localStorage.getItem("currentUser") || "null");
          loggedInUserId = String(storedUser && storedUser.id || "").trim().toLowerCase();
        } catch (error) {
          console.error("Could not read signed-in account:", error);
        }
        if (storedUser && String(storedUser.id || "").toLowerCase() === profileId.toLowerCase()) {
          const cachedId = String(storedUser.id);
          renderProfile(storedUser, cachedId, { [cachedId]: storedUser }, false);
          document.getElementById("profile-content").hidden = false;
          document.getElementById("profile-status").textContent = "Refreshing your profile...";
        }

        const app = firebase.apps.find(existing => existing.name === "[DEFAULT]") ||
          firebase.initializeApp(profileFirebaseConfig);
        profileDatabase = app.database();
        const directSnapshot = await withTimeout(
          profileDatabase.ref(`users/${profileId}`).once("value"),
          8000,
          "Profile request"
        );
        let id = profileId;
        let user = directSnapshot.val();
        let users = user ? { [id]: user } : null;
        if (!user) {
          const usersSnapshot = await withTimeout(
            profileDatabase.ref("users").once("value"),
            8000,
            "Profile search"
          );
          users = usersSnapshot.val() || {};
          const entries = Object.entries(users);
          const entry = entries.find(([key]) => key.toLowerCase() === profileId.toLowerCase()) ||
            entries.find(([, account]) => String(account && account.id || "").toLowerCase() === profileId.toLowerCase());
          if (!entry) {
            showProfileError("This profile could not be found.");
            return;
          }
          [id, user] = entry;
        }
        profileAccount = user;
        profileAccountId = id;
        renderProfile(user, id, users, false);
        const isOwner = loggedInUserId === id.toLowerCase();
        document.getElementById("edit-toggle").hidden = !isOwner;
        document.getElementById("avatar-upload-button").hidden = !isOwner;
        document.getElementById("verification-application").hidden = !isOwner;
        if (isOwner) {
          const badgeTypeSelect = document.getElementById("verification-application-badge-type");
          if (["profile_star", "gold_check", "winged_check"].includes(user.verifiedBadgeType)) {
            badgeTypeSelect.value = user.verifiedBadgeType;
          }
          const isChangingBadge = user.verifiedBadge === true;
          document.getElementById("verification-application-title").textContent =
            isChangingBadge ? "Request a badge change" : "Apply for a verified badge";
          document.getElementById("verification-application-description").textContent =
            isChangingBadge
              ? "Choose the badge you want instead. Your current badge stays until an admin approves the change."
              : "Choose a badge style and apply for admin review. The badge appears after an admin approves it.";
          document.getElementById("verification-application-submit").textContent =
            isChangingBadge ? "Request badge change" : "Apply for badge";
          loadVerificationApplicationStatus();
        }
        if (isOwner) fillProfileEditor(user, id);

        document.getElementById("profile-status").hidden = true;
        document.getElementById("profile-content").hidden = false;
        await completeEmailVerification(app);
        if (Object.keys(users).length > 1) {
          renderProfile(user, id, users, true);
        } else {
          withTimeout(
            profileDatabase.ref("users").once("value"),
            12000,
            "Leaderboard ranking request"
          ).then(snapshot => {
            const allUsers = snapshot.val() || {};
            renderProfile(user, id, allUsers, true);
          }).catch(error => {
            console.error("Could not load the full leaderboard for profile rank:", error);
            document.getElementById("profile-rank-status").textContent =
              "Profile loaded. Leaderboard rank is temporarily unavailable.";
          });
        }
      } catch (error) {
        console.error("Could not load profile:", error);
        showProfileError(error.message && error.message.includes("timed out")
          ? "The profile server is taking too long to respond. Check your connection and try again."
          : "Could not load this profile. Please check your connection and try again.");
      }
    }

    async function loadVerificationApplicationStatus() {
      const status = document.getElementById("verification-application-status");
      const button = document.getElementById("verification-application-submit");
      try {
        const snapshot = await withTimeout(
          profileDatabase.ref(`verification_requests/${profileAccountId}`).once("value"),
          8000,
          "Verification application request"
        );
        const request = snapshot.val();
        if (request && request.status === "pending") {
          status.textContent = request.changeRequest
            ? "Your badge change request is waiting for admin review."
            : "Your application is waiting for admin review.";
          button.disabled = true;
          button.textContent = "Request pending";
        } else {
          status.textContent = "";
          button.disabled = false;
          button.textContent = profileAccount.verifiedBadge === true
            ? "Request badge change"
            : "Apply for badge";
        }
      } catch (error) {
        console.error("Could not load verification application status:", error);
        status.textContent = "Could not check your application status. Please try again.";
      }
    }

    async function submitVerificationApplication() {
      const status = document.getElementById("verification-application-status");
      const button = document.getElementById("verification-application-submit");
      if (!profileDatabase || !profileAccount || !profileAccountId ||
          loggedInUserId !== profileAccountId.toLowerCase()) {
        status.textContent = "Log in with this account to apply.";
        return;
      }
      const requestedBadgeType = document.getElementById("verification-application-badge-type").value;
      if (!["profile_star", "gold_check", "winged_check"].includes(requestedBadgeType)) {
        status.textContent = "Choose one of the available badge styles.";
        return;
      }
      const changeRequest = profileAccount.verifiedBadge === true;
      button.disabled = true;
      status.textContent = changeRequest ? "Submitting badge change request..." : "Submitting application...";
      try {
        const requestRef = profileDatabase.ref(`verification_requests/${profileAccountId}`);
        const existing = await withTimeout(requestRef.once("value"), 8000, "Verification request");
        if (existing.val() && existing.val().status === "pending") {
          status.textContent = existing.val().changeRequest
            ? "Your badge change request is already waiting for admin review."
            : "Your application is already waiting for admin review.";
          button.textContent = "Request pending";
          return;
        }
        await requestRef.set({
          userId: profileAccountId,
          name: String(profileAccount.name || profileAccountId),
          badgeType: requestedBadgeType,
          changeRequest,
          note: document.getElementById("verification-application-reason").value.trim(),
          status: "pending",
          requestedAt: Date.now()
        });
        status.textContent = changeRequest
          ? "Badge change request sent. Your current badge remains until an admin approves it."
          : "Application sent. An admin will review your profile.";
        button.textContent = "Request pending";
      } catch (error) {
        console.error("Could not submit verified badge application:", error);
        status.textContent = error.message || "Could not submit your application. Check your connection and try again.";
        button.disabled = false;
      }
    }

    async function autoSaveProfilePhoto(file) {
      const status = document.getElementById("profile-photo-status");
      const uploadButton = document.getElementById("avatar-upload-button");
      const avatar = document.getElementById("profile-avatar");
      const photoInput = document.getElementById("edit-photo-file");
      const originalPic = profileAccount && profileAccount.pic || "";
      if (!profileDatabase || !profileAccount || !profileAccountId ||
          loggedInUserId !== profileAccountId.toLowerCase()) {
        status.textContent = "Log in with this account to change its photo.";
        photoInput.value = "";
        return;
      }

      if (!file.type.startsWith("image/")) {
        status.textContent = "Please choose an image file.";
        photoInput.value = "";
        return;
      }

      uploadButton.disabled = true;
      status.textContent = "Updating profile photo...";
      const previewUrl = URL.createObjectURL(file);
      if (avatar.dataset.previewUrl) URL.revokeObjectURL(avatar.dataset.previewUrl);
      avatar.dataset.previewUrl = previewUrl;
      avatar.src = previewUrl;
      try {
        const pic = await compressProfilePhoto(file);
        await profileDatabase.ref(`users/${profileAccountId}`).update({ pic });
        profileAccount = { ...profileAccount, pic };
        const storedUser = JSON.parse(localStorage.getItem("currentUser") || "null");
        if (storedUser && String(storedUser.id || "").toLowerCase() === profileAccountId.toLowerCase()) {
          localStorage.setItem("currentUser", JSON.stringify({ ...storedUser, pic }));
        }
        avatar.src = pic;
        delete avatar.dataset.previewUrl;
        URL.revokeObjectURL(previewUrl);
        status.textContent = "Profile photo updated.";
      } catch (error) {
        console.error("Profile photo update failed:", error);
        avatar.src = originalPic || "logo.png";
        delete avatar.dataset.previewUrl;
        URL.revokeObjectURL(previewUrl);
        status.textContent = error.message || "Could not update the photo. Check your connection and try again.";
      } finally {
        uploadButton.disabled = false;
        photoInput.value = "";
      }
    }

    loadProfile();
  </script>
</body>
</html>
